<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Shakaaraah</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <main class="narrow">
    <img class="logo" src="{{ url_for('static', filename='logo.png') }}" width="200" alt="Shakaaraah Communications">
    <h1>Sign in</h1>
    <p class="muted">Quote requests from the website are kept here.</p>
    {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
